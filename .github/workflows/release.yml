name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build universal macOS app
        run: |
          xcodebuild \
            -project CleaningLock.xcodeproj \
            -scheme CleaningLock \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign and package
        run: |
          APP_PATH="build/Build/Products/Release/CleaningLock.app"
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" CleaningLock-macOS.zip
          shasum -a 256 CleaningLock-macOS.zip > CleaningLock-macOS.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            CleaningLock-macOS.zip \
            CleaningLock-macOS.zip.sha256 \
            --title "CleaningLock ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
